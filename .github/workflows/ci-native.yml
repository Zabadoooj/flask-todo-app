name: Flask CI Pipeline

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and patch Python 3.10 compatibility
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install markupsafe==2.0.1 werkzeug==0.16.1 itsdangerous==1.1.0 click==7.1.2 Jinja2==2.11.3
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages())")
          echo "import collections, collections.abc" > "$SITE_PACKAGES/sitecustomize.py"
          echo "for attr in ['Mapping', 'MutableMapping', 'Iterable', 'Callable', 'Sequence']:" >> "$SITE_PACKAGES/sitecustomize.py"
          echo "    if not hasattr(collections, attr):" >> "$SITE_PACKAGES/sitecustomize.py"
          echo "        setattr(collections, attr, getattr(collections.abc, attr))" >> "$SITE_PACKAGES/sitecustomize.py"

      - name: Initialize SQLite database
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/application:$(find $(pwd)/application -type d | tr '\n' ':')
          python manage.py db upgrade

      - name: Smoke test Flask server
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/application:$(find $(pwd)/application -type d | tr '\n' ':')
          python manage.py runserver &
          sleep 5
          curl -I http://127.0.0.1:7345
