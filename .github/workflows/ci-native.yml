name: Flask CI Pipeline

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize SQLite database
        run: |
          python manage.py db init || true
          python manage.py db migrate || true
          python manage.py db upgrade || python -c "from application import create_app,  db; app = create_app; app.app_context().push; db.create_all()"

      - name: Smoke test Flask server
        run: |
          python manage.py &
          sleep 5
          curl -I http://127.0.0.1:5000
